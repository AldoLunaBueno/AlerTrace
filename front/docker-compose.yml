version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - sachatrace-network

  api:
    image: sachatrace/api:latest
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
    networks:
      - sachatrace-network

networks:
  sachatrace-network:
    driver: bridge
