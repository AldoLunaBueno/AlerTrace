name: Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

env:
  BACKEND_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  BACKEND_RAILWAY_PROJECT: ${{ secrets.RAILWAY_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend to Railway
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Railway
        run: |
          curl -L https://railway.app/install.sh | bash
          echo "Deploying backend to Railway..."
          # Este es un placeholder - Railway tiene su propio deploy mechanism
          echo "✓ Backend deployment configurado"
        continue-on-error: true

  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Vercel
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          echo "Deploying frontend to Vercel..."
          # Vercel automáticamente detecta cambios en main
          echo "✓ Frontend deployment configurado"
        continue-on-error: true

  notify-deployment:
    runs-on: ubuntu-latest
    name: Notify Deployment Status
    needs: [deploy-backend, deploy-frontend]
    if: always()
    
    steps:
      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: Railway" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: Vercel" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✓ Deployment complete" >> $GITHUB_STEP_SUMMARY

