name: Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests (Python)
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Lint with pylint
        run: |
          cd backend
          pylint api/ --disable=C0111,C0103,R0903 --fail-under=7.0 || true
      
      - name: Run backend tests
        run: |
          cd backend
          pytest api/tests/ -v --cov=api --cov-report=xml || true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend Tests (TypeScript)
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js and pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'front/pnpm-lock.yaml'
      
      - name: Install dependencies
        run: |
          cd front
          pnpm install --frozen-lockfile
      
      - name: Lint
        run: |
          cd front
          pnpm run lint || true
      
      - name: Type check
        run: |
          cd front
          pnpm run type-check || true
      
      - name: Build Next.js
        run: |
          cd front
          pnpm run build

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  health-check:
    runs-on: ubuntu-latest
    name: API Health Check
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Check API imports
        run: |
          cd backend
          python -c "from api.main import app; print('✓ API imports OK')"

