services:
  # Redis para caché y sesiones
  redis:
    image: redis:7-alpine
    container_name: mallkitrace_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # API FastAPI - Usando AWS RDS PostgreSQL
  api:
    build: 
      context: ../api
      dockerfile: Dockerfile
    container_name: mallkitrace_api
    env_file:
      - ../.env  # Cargar todas las variables del .env incluyendo AWS RDS
    ports:
      - "8000:8000"
    volumes:
      - ../api:/app
    depends_on:
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  redis_data: