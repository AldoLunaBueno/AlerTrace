services:
  # API FastAPI
  api:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    container_name: alertrace_api
    env_file:
      - ../.env
    ports:
      - "8002:8000"
    volumes:
      - ../backend:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # Frontend Next.js
  frontend:
    build:
      context: ../front
      dockerfile: Dockerfile
    container_name: alertrace_frontend
    ports:
      - "3000:8080"
    volumes:
      - ../front:/app
      - /app/node_modules
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8002
      - NEXT_PUBLIC_WRITE_API_URL=http://localhost:8002
    restart: unless-stopped